# NOXEL SPECTRA pour Shopify — configuration de l'app.
# client_id, application_url et redirect_urls sont remplis par `npm run config:link` (Shopify CLI)
# une fois l'app créée dans le tableau de bord Shopify Partners.
client_id = ""
name = "NOXEL SPECTRA"
application_url = "https://shopify.noxelspectra.com"
embedded = true

[access_scopes]
# Lire les produits et leurs images, remplacer le contenu d'une image (fileUpdate), sauvegarder l'original (fileCreate)
scopes = "read_products,write_products,read_files,write_files"

[auth]
redirect_urls = [ "https://shopify.noxelspectra.com/auth/callback" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Webhooks de conformité (vie privée), obligatoires pour l'App Store
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]
