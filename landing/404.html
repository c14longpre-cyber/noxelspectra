<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page introuvable — NOXEL SPECTRA</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/noxel-shell.css">
<style>
  :root { --bg: #07090f; --text: #f5f5f5; --muted: rgba(255,255,255,.6); --border: #10dada59; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
  main { flex: 1; display: grid; place-items: center; padding: 48px 16px; text-align: center; }
  .code { font-size: clamp(64px, 14vw, 120px); font-weight: 900; line-height: 1; margin: 0;
           background: linear-gradient(90deg, #3ddc84, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { font-size: 24px; margin: 12px 0 8px; }
  p { color: var(--muted); max-width: 460px; margin: 0 auto 24px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; text-decoration: none;
          border: 1px solid rgba(61,220,132,.4); color: #3ddc84; background: rgba(61,220,132,.08); }
  .btn--violet { border-color: rgba(168,85,247,.45); color: #c9a2ff; background: rgba(168,85,247,.08); }
  .simple-bar { height: 72px; padding: 0 20px; display: flex; align-items: center; border-bottom: 1px solid var(--border); }
  .simple-bar img { height: 58px; }
</style>
</head>
<body>
<header class="nx-bar">
  <a class="nx-bar__brand" href="/" aria-label="NOXEL SPECTRA"><img src="/NOXEL_SPECTRA_LOGO.svg" alt="NOXEL SPECTRA" class="nx-bar__logo" width="150" height="150"></a>
  <nav class="nx-bar__nav nx-bar__nav--static" aria-label="Navigation principale" style="display:flex;position:static;flex-direction:row;padding:0;background:none;border:0;margin-left:12px">
    <a class="nx-nav" href="/images/">Images</a>
    <a class="nx-nav" href="/video/">Vidéo</a>
  </nav>
</header>
<main>
  <div>
    <p class="code" aria-hidden="true">404</p>
    <h1>Cette page n'existe pas</h1>
    <p>L'adresse est peut-être mal écrite, ou la page a été déplacée. Tes images, elles, t'attendent dans l'app.</p>
    <div class="actions">
      <a class="btn" href="https://app.noxelspectra.com/" rel="noopener">→ Ouvrir NOXEL SPECTRA</a>
      <a class="btn btn--violet" href="/" rel="noopener">Accueil</a>
    </div>
    <div lang="en" style="margin-top:28px;opacity:.85">
      <h2 style="font-size:18px;margin:0 0 6px">This page doesn't exist</h2>
      <p>The address may be mistyped, or the page has moved. <a href="/en/">English home page</a> · <a href="https://app.noxelspectra.com/?lang=en" rel="noopener">Open NOXEL SPECTRA</a></p>
    </div>
  </div>
</main>
</body>
</html>
